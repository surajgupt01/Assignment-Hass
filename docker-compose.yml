services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hasamex_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - chroma_data:/app/chroma_db
      - ./backend/data:/app/data:ro
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - SITE_URL=http://localhost:3000
      - SITE_NAME=Hasamex Transcript Analyzer

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: hasamex_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  chroma_data:
    driver: local